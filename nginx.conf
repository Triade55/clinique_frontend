server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache pour les assets statiques et médias
    location ~* \.(jpg|jpeg|png|gif|ico|svg|mp4|webm|pdf|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Application Astro (SPA / MPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy transparent vers le backend Django
    location /api/ {
        proxy_pass http://clinic_web:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
